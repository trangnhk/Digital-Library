<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Users Management</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">

        <style>

            body {
                background-color: #f5f7fb;
                color: #212529;
            }

            .dashboard-card {
                border: 1px solid #dee2e6;
                border-radius: 14px;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
                background-color: #ffffff;
                overflow: hidden;
            }

            .header-card {
                border-left: 5px solid #0d6efd;
            }

            .section-title {
                font-weight: 700;
                margin-bottom: 4px;
            }

            .section-subtitle {
                font-size: 14px;
                color: #6c757d;
                margin-bottom: 0;
            }

            .table thead th {
                background-color: #f8f9fa;
                font-size: 13px;
                text-transform: uppercase;
                color: #495057;
                border-bottom: 2px solid #dee2e6;
                white-space: nowrap;
            }

            .table td {
                vertical-align: middle;
                font-size: 14px;
            }

            .table tbody tr:hover {
                background-color: #f8fbff;
            }

            .user-avatar {
                width: 52px;
                height: 52px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid #dee2e6;
            }

            .user-name {
                font-weight: 700;
            }

            .user-meta {
                color: #6c757d;
                font-size: 13px;
            }

            .status-badge {
                border-radius: 999px;
                padding: 6px 12px;
                font-size: 12px;
                font-weight: 700;
            }

            .empty-state {
                border: 1px dashed #ffc107;
                border-radius: 12px;
                background-color: #fff9e6;
                color: #664d03;
                padding: 18px;
            }

        </style>

    </head>

    <body>

        <div class="container mt-5 mb-5">

            <!-- HEADER -->
            <div class="card dashboard-card header-card mb-4">

                <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-3">

                    <div>

                        <h1 class="h3 fw-bold mb-1">
                            Users Management
                        </h1>

                        <p class="text-muted mb-0">
                            Manage all users in the digital library system.
                        </p>

                    </div>

                    <div class="d-flex gap-2 flex-wrap">

                        <a th:href="@{/admin}"
                           class="btn btn-outline-secondary">
                            Back to Dashboard
                        </a>

                        <span class="badge bg-primary fs-6 px-3 py-2 rounded-pill"
                              th:text="'Total Users: ' + ${#lists.size(users)}">
                            Total Users: 0
                        </span>

                    </div>

                </div>

            </div>

            <!-- TABLE -->
            <div class="card dashboard-card">

                <div class="card-header bg-white">

                    <div>

                        <h5 class="section-title">
                            User List
                        </h5>

                        <p class="section-subtitle">
                            All registered users in the system.
                        </p>

                    </div>

                </div>

                <div class="card-body p-0">

                    <!-- EMPTY -->
                    <div th:if="${#lists.isEmpty(users)}"
                         class="p-4">

                        <div class="empty-state">
                            No users found.
                        </div>

                    </div>

                    <!-- TABLE -->
                    <div class="table-responsive"
                         th:if="${!#lists.isEmpty(users)}">

                        <table class="table table-bordered table-hover align-middle mb-0">

                            <thead>

                                <tr>
                                    <th style="width: 90px;">ID</th>
                                    <th style="min-width: 260px;">User</th>
                                    <th style="min-width: 220px;">Email</th>
                                    <th style="min-width: 150px;">Phone</th>
                                    <th style="width: 140px;">Role</th>
                                    <th style="width: 140px;">Status</th>
                                </tr>

                            </thead>

                            <tbody>

                                <tr th:each="u : ${users}">

                                    <!-- ID -->
                                    <td>

                                        <span class="badge bg-light text-dark border px-3 py-2"
                                              th:text="${u.id}">
                                            1
                                        </span>

                                    </td>

                                    <!-- USER -->
                                    <td>

                                        <div class="d-flex align-items-center gap-3">

                                            <img th:src="${u.avatar != null ? u.avatar : '/images/default-avatar.png'}"
                                                 alt="avatar"
                                                 class="user-avatar">

                                            <div>

                                                <div class="user-name"
                                                     th:text="${u.username}">
                                                    username
                                                </div>

                                                <div class="user-meta">

                                                    <span th:text="${u.firstName}">
                                                        First Name
                                                    </span>

                                                    <span th:if="${u.lastName != null}"
                                                          th:text="' ' + ${u.lastName}">
                                                        Last Name
                                                    </span>

                                                </div>

                                            </div>

                                        </div>

                                    </td>

                                    <!-- EMAIL -->
                                    <td>

                                        <span class="fw-semibold"
                                              th:text="${u.email}">
                                            example@gmail.com
                                        </span>

                                    </td>

                                    <!-- PHONE -->
                                    <td th:text="${u.phone}">
                                        0123456789
                                    </td>

                                    <!-- ROLE -->
                                    <td>

                                        <span class="badge bg-secondary status-badge"
                                              th:text="${u.role}">
                                            USER
                                        </span>

                                    </td>

                                    <!-- STATUS -->
                                    <td>

                                        <span th:if="${u.active}"
                                              class="badge bg-success status-badge">
                                            Active
                                        </span>

                                        <span th:unless="${u.active}"
                                              class="badge bg-danger status-badge">
                                            Inactive
                                        </span>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </body>

</html>
